name: Test and package dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r .\requirements-build.txt

      - name: Test source and UI startup
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe .\src\scv2_dashboard.py --self-test
          $env:QT_QPA_PLATFORM = "offscreen"
          .\.venv\Scripts\python.exe .\src\scv2_dashboard.py --demo --exit-after 1

      - name: Package and test executable
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-dashboard-exe.ps1
          .\SCV2-Dashboard.exe --self-test

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: SCV2-Dashboard-windows-x64
          path: SCV2-Dashboard.exe
          if-no-files-found: error
