name: Release dashboard

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r .\requirements-build.txt

      - name: Test and package dashboard
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe .\src\scv2_dashboard.py --self-test
          $env:QT_QPA_PLATFORM = "offscreen"
          .\.venv\Scripts\python.exe .\src\scv2_dashboard.py --demo --exit-after 1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-dashboard-exe.ps1
          New-Item -ItemType Directory -Path .\release-assets -Force | Out-Null
          Copy-Item -LiteralPath .\SCV2-Dashboard.exe -Destination .\release-assets\
          $hash = (Get-FileHash -LiteralPath .\SCV2-Dashboard.exe -Algorithm SHA256).Hash
          "$hash *SCV2-Dashboard.exe" | Set-Content -LiteralPath .\release-assets\SCV2-Dashboard.exe.sha256 -Encoding ascii -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCV2-Dashboard-windows-x64
          path: release-assets/
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title "SCV2 Dashboard $env:RELEASE_TAG" --generate-notes --verify-tag
          }
          gh release upload $env:RELEASE_TAG .\release-assets\SCV2-Dashboard.exe .\release-assets\SCV2-Dashboard.exe.sha256 --clobber
